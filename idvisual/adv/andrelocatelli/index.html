<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>André Locatelli · Advocacia</title>
<style>
:root{--ouro:#C6A253;--ouro2:#8a6b22;--bg:#f3f1ec;--card:#fff;--tx:#222;--mut:#6b6b66;--bd:#ddd8cc}
@media (prefers-color-scheme: dark){:root{--ouro2:#d9b866;--bg:#17160f;--card:#211f17;--tx:#ece8dc;--mut:#a39f90;--bd:#3a372b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.logo{width:min(210px,52vw);height:auto;display:block;margin:0 auto 26px}
.assin{text-align:center;margin:0 auto 64px;font-family:"Times New Roman","Liberation Serif",Georgia,serif}
.assin .n{font-weight:700;font-size:clamp(15px,4vw,19px);letter-spacing:.2em;padding-left:.2em;color:var(--tx)}
.assin .a{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:4px;color:var(--ouro);font-size:clamp(11px,2.9vw,13px);letter-spacing:.32em}
.assin .a::before,.assin .a::after{content:"";height:1px;width:clamp(30px,8vw,50px);background:#b9b3a3}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(520px,100%)}
@media(max-width:480px){nav{grid-template-columns:1fr}}
.b{display:block;text-align:center;text-decoration:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-bottom:3px solid var(--ouro);border-radius:10px;padding:18px 12px;font:600 15px system-ui,sans-serif;cursor:pointer;width:100%}
.b:hover{border-color:var(--ouro);background:var(--ouro);color:#fff}
.b small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:3px}.b:hover small{color:#fff}
#sub{display:none;grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#sub.on{display:grid}@media(max-width:480px){#sub{grid-template-columns:1fr}}
#sub .b{border-bottom-color:var(--ouro2);background:var(--bg)}
footer{margin-top:34px;font-size:12px;color:var(--mut)}
</style></head><body>
<img class="logo" src="perfis/andrelocatelli/logo.png" alt="André Locatelli">
<div class="assin"><div class="n">ANDRÉ LOCATELLI</div><div class="a">ADVOGADO</div></div>
<nav>
 <a class="b" href="pecas.html">Identidade visual<small>peças / petições</small></a>
 <a class="b" href="gerador.html?doc=procuracao">Procurações<small>leitura de RG/CNH e comprovante</small></a>
 <a class="b" href="gerador.html?doc=hipossuficiencia">Hipossuficiência<small>declaração</small></a>
 <button class="b" id="bc" aria-expanded="false">Contratos<small>escolher modelo ▾</small></button>
 <div id="sub">
  <a class="b" href="gerador.html?doc=salario-maternidade">Contrato salário-maternidade</a>
  <a class="b" href="gerador.html?doc=previdenciario">Contrato serviços previdenciários</a>
  <a class="b" href="gerador.html?doc=previdenciario-generico">Contrato genérico previdenciário</a>
 </div>
</nav>
<footer>OAB/GO 73.211 · Piracanjuba/GO</footer>
<script>const bc=document.getElementById('bc'),s=document.getElementById('sub');bc.onclick=()=>{const o=s.classList.toggle('on');bc.setAttribute('aria-expanded',o)}</script>
</body></html>
